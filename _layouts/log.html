<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">
  {% include head.html %}
  <body>
    {% include header.html %}
    <main class="page-content" aria-label="Content">
      <nav id="toc" class="toc" aria-label="Table of contents"></nav>
      <div class="log-wrapper">
        <article class="log">
          <header class="log-header">
            <nav class="breadcrumbs">
              <a href="{{ '/' | relative_url }}">home</a> / <a href="{{ '/' | append: page.collection | append: '/' | relative_url }}">{{ page.collection }}</a> / {{ page.title }}
            </nav>
            <h1 class="log-title">{{ page.title }}</h1>
            <div class="log-meta">
              <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%b %d, %Y" }}</time>
              {% if page.tags %}
              <div class="tags">
                {% for tag in page.tags %}
                <span class="tag">{{ tag }}</span>
                {% endfor %}
              </div>
              {% endif %}
            </div>
          </header>
          <div class="log-content">
            {{ content }}
          </div>
        </article>
      </div>
    </main>
    {% include footer.html %}
    <button id="scroll-top" class="scroll-top" aria-label="Scroll to top" hidden>&#8593;</button>
    <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
  </body>
</html>
