---
layout: default
---

{% unless page.hide_title %}
<article class="page">
  <header class="page-header">
    <h1 class="page-title">{{ page.title }}</h1>
  </header>
  <div class="page-content">
    {{ content }}
  </div>
</article>
{% else %}
<div class="page-content">
  {{ content }}
</div>
{% endunless %}
